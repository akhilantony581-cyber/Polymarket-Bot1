# ============================================================
# Polymarket Trading Bot — Configuration
# ============================================================

# --- Global Safety (hard backstop — applies to ALL bots) ---
# Per-market exposure cap only. Price floor removed — each bot enforces its own.
global_safety:
  max_per_market: 100.0

# --- Capital & Risk ---
capital:
  total: 150.0
  max_concurrent_trades: 500
  maker_allocation_pct: 0.30
  max_per_trade: 30.0
  max_per_market: 30.0

risk:
  consecutive_loss_limit: 999      # Effectively disabled — bot runs continuously
  volatility_spike_threshold: 2.5  # Stop if rolling std dev exceeds this multiplier
  kelly:
    score_95_100: 0.15             # 15% of capital
    score_90_94:  0.10             # 10% of capital
    score_85_89:  0.06             # 6% of capital

# --- Price Rules ---
price:
  min_entry: 0.99                  # Bot 1 Snipe 1 hard floor
  standard_max: 0.999
  sniper_min: 0.99                 # Snipe 1 trigger threshold (15m)
  snipe1_window_seconds: 30        # Fire in last N seconds of 15m market

# --- Signal Engine ---
signal:
  reversal_score_threshold: 5      # Only trade when score < 5 (0–100 scale)
  buffer_from_strike_pct: 0.005    # Binance price must be this % beyond strike
  stability_window_seconds: 45     # Price must hold beyond strike for this long
  momentum_windows: [60, 180, 300] # 1m, 3m, 5m in seconds

# --- Standard Mode ---
standard:
  order_timeout_seconds: 20
  passive_limit_offset: 0.001      # Place limit this far below best ask

# --- Sniper Mode ---
sniper:
  time_to_expiry_threshold: 60     # Seconds remaining to trigger sniper mode
  order_timeout_seconds: 55
  reprice_interval_seconds: 3
  oracle_strike_buffer: 0.003      # Abort if oracle within 0.3% of strike
  stability_check_seconds: 5

# --- Maker Mode ---
maker:
  post_price_range: [0.93, 0.96]   # Post limit orders in this range
  order_timeout_seconds: 7200      # 2 hours
  min_certainty_score: 80

# --- Order Book ---
order_book:
  min_bid_ask_ratio: 1.2           # Bids must exceed asks by this ratio
  min_depth_at_price: 100.0        # Min $ depth at entry price level

# --- Markets ---
markets:
  coins: ["BTC", "ETH", "SOL", "XRP"]
  timeframes: ["5m", "15m", "1h"]
  binance_symbols:
    BTC: "BTCUSDT"
    ETH: "ETHUSDT"
    SOL: "SOLUSDT"
    XRP: "XRPUSDT"

# --- Market Maker Both-Sides ---
# Places GTC limit buy orders on both winning and losing sides when
# the winning price is 0.90-0.97. No taker fees on limit orders.
# Both sides together must sum to < 0.97 (3% profit margin guaranteed).
market_maker:
  enabled: false

# --- Volatility Gate ---
# Blocks trades when Binance realized volatility is too high (choppy/spiky market).
# vol_pct: skip if 60s std-dev > this % of price (0.08 = calm; >0.10 = active news)
# range_pct: skip if 30s high-low range > this % of price
volatility_gate:
  enabled: true
  window_seconds: 60
  max_vol_pct: 0.08
  max_range_pct: 0.10

# --- Momentum Gate (suggestions 2 & 4) ---
# Blocks trades when Binance price is running against the direction being bought,
# or when price has barely moved (too close to boundary to be confident).
momentum_gate:
  enabled: true
  window_seconds: 30
  min_pct: 0.05
  boundary_pct: 0.03

# --- Snipe 3 — Contrarian bet on 5m markets (buy losing side at ≤ $0.02) ---
# Buys the cheap/losing side (YES or NO) when it is priced at or below max_entry_price.
# For fixed-strike markets: only fires when Binance price is within strike_buffer of
# the strike (reversal is plausible). For Up/Down markets: fires on price alone.
snipe3:
  enabled: true
  max_entry_price: 0.02     # buy whichever side costs ≤ 2 cents
  max_per_trade: 1.0
  max_per_market: 2.0
  window_seconds: 180       # last 3 minutes of the 5m market
  strike_buffer: 0.003      # fixed-strike only: Binance must be within 0.3% of strike
  order_timeout_seconds: 30

# --- 1h Sniper (separate settings from 5m/15m) ---
snipe_1h:
  enabled: true
  min_price: 0.92
  max_per_trade: 10.0
  max_per_market: 60.0
  window_seconds: 900    # fire in last 15 minutes of the 1h market (was 25m)


# --- Bot 3 — Locked Arbitrage Market Maker ---
# Buys equal contracts of YES + NO on 1h crypto markets whenever
# YES_ask + NO_ask ≤ arb_threshold.  Profit is guaranteed regardless
# of direction: N × (0.98 − YES_ask − NO_ask) USDC per arb.
# 2% redemption fee is already baked into the 0.98 effective payout.
arb_bot:
  enabled: true
  arb_threshold: 0.97          # fire when YES_ask+NO_ask ≤ this (1%+ guaranteed profit after fee)
  size_usdc: 50.0              # total USDC per arb (split equally as contracts between YES+NO)
  max_concurrent_arbs: 4       # max arbs in-flight at once
  min_tte_seconds: 300         # minimum 5 min remaining on 1h market before entering
  fill_timeout_seconds: 60     # cancel unfilled legs after this many seconds
  market_cooldown_seconds: 120 # seconds before re-entering the same market

# --- Bot 3 — Copy Trader (DISABLED — replaced by arb_bot) ---
copy_trader:
  enabled: false
  target_wallet: "0xf247584e41117bbbe4cc06e4d2c95741792a5216"
  min_price: 0.89
  max_per_market: 100.0
  poll_interval_seconds: 5

# --- Paused Bots ---
# List bot names here to disable their trading loops while keeping them running.
# Valid values: "bot1" (15m/5m sniper), "bot2" (1h sniper)
paused_bots: ["bot1", "bot2"]

execution:
  polygon_rpc: "${POLYGON_RPC_URL}"
  order_check_interval: 1.0        # Seconds between order status checks

# --- Logging ---
logging:
  level: "INFO"
  trade_log_file: "logs/trades.jsonl"
  signal_log_file: "logs/signals.jsonl"
  metrics_log_file: "logs/metrics.jsonl"

# --- Telegram ---
telegram:
  enabled: true
  alert_on_trade: true
  alert_on_cancel: true
  alert_on_error: true

# --- Dashboard ---
dashboard:
  host: "0.0.0.0"
  port: 8080
  config_watch_interval: 2.0       # Seconds between config file re-reads
